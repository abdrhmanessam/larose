<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>LAROSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Lalezar&display=swap" rel="stylesheet">
<style>
/* Concept: sticker-sheet storefront. Cream paper ground, royal-blue blocks with cream lettering, pink starbursts as stickers, thick ink outlines, and the LAROSE logo scattered across the page as a slowly drifting pattern. */
:root{
  --bg:#f7f5ec;--surface:#fffdf6;--surface-2:#efe9d6;--ink:#111a4d;--muted:#555d86;--line:rgba(17,26,77,.14);
  --edge:#111a4d;--drop:#111a4d;
  --brand:#2f4fd8;--brand-deep:#1f37ad;--on-brand:#f7f5ec;--brand-text:#2f4fd8;
  --pink:#f19ad3;--pink-deep:#d4619f;--on-pink:#111a4d;--wa:#13914d;
  --logo-op:.11;
  --fd:'Lalezar','Cairo',system-ui,sans-serif;--fb:'Cairo','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0f36;--surface:#141b57;--surface-2:#1b2470;--ink:#f7f5ec;--muted:#b3bae9;--line:rgba(247,245,236,.18);
  --edge:rgba(247,245,236,.88);--drop:#04071f;
  --brand:#3556e6;--brand-deep:#2440c4;--brand-text:#a3b4ff;--pink-deep:#f19ad3;--logo-op:.15;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f36;--surface:#141b57;--surface-2:#1b2470;--ink:#f7f5ec;--muted:#b3bae9;--line:rgba(247,245,236,.18);
  --edge:rgba(247,245,236,.88);--drop:#04071f;
  --brand:#3556e6;--brand-deep:#2440c4;--brand-text:#a3b4ff;--pink-deep:#f19ad3;--logo-op:.15;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
img,svg{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
#app{position:relative;overflow-x:clip;min-height:100%}
.wrap{width:100%;max-width:1180px;margin-inline:auto;padding-inline:clamp(16px,4vw,32px);position:relative;z-index:1}
main,header,footer,.tabbar{position:relative;z-index:1}

/* scattered logos */
#scatter{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#scatter img{position:absolute;height:auto;opacity:var(--logo-op);animation:drift var(--dur,12s) ease-in-out infinite alternate;animation-delay:var(--dl,0s);will-change:transform}
@keyframes drift{from{transform:translateY(-12px) scale(.98)}to{transform:translateY(16px) scale(1.03)}}
#prog{position:fixed;top:0;left:0;right:0;height:4px;background:var(--pink);transform-origin:100% 50%;transform:scaleX(0);z-index:80}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:2px solid transparent;transition:border-color .3s,box-shadow .3s}
.top.scrolled{border-color:var(--line);box-shadow:0 10px 24px -18px rgba(0,0,0,.55)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px}
.brand img{height:50px;width:auto;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.brand:hover img{transform:rotate(-4deg) scale(1.05)}
.nav{display:flex;gap:4px;background:var(--surface);border:2.5px solid var(--edge);border-radius:999px;padding:4px}
.nav a{padding:6px 18px;border-radius:999px;font-weight:800;font-size:15px;transition:background .25s,color .25s}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--brand);color:var(--on-brand)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:999px;font-weight:800;font-size:16px;border:2.5px solid var(--edge);box-shadow:0 4px 0 var(--drop);cursor:pointer;transition:transform .2s,box-shadow .2s;line-height:1.4;background:var(--surface)}
.btn:hover{transform:translateY(2px);box-shadow:0 2px 0 var(--drop)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--drop)}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.pink{background:var(--pink);color:var(--on-pink)}
.btn.green{background:var(--wa);color:#fff}
.btn svg{width:20px;height:20px;flex:none}
.btn.sm{padding:8px 16px;font-size:14px}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(20px,4vw,48px);align-items:center;padding-block:clamp(20px,4vw,48px)}
.hero-text{min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:2.5px solid var(--edge);border-radius:999px;padding:4px 14px 4px 8px;font-weight:800;font-size:14px;margin:0 0 18px}
.eyebrow svg{width:22px;height:22px;animation:spin 9s linear infinite}
h1.big{font-family:var(--fd);font-weight:400;font-size:clamp(42px,8vw,92px);line-height:1.12;margin:0 0 16px;text-wrap:balance}
.hl{display:inline-block;background:var(--pink);color:var(--on-pink);padding:0 .22em;border-radius:.3em;rotate:-2deg;border:3px solid var(--edge);box-shadow:5px 5px 0 var(--drop)}
.lead{font-size:clamp(16px,2.4vw,19px);color:var(--muted);max-width:34em;margin:0 0 24px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.mini{display:flex;gap:8px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.mini li{background:var(--surface-2);border-radius:999px;padding:3px 14px;font-weight:700;font-size:14px}
.art{position:relative;aspect-ratio:1/1;width:100%;max-width:520px;margin-inline:auto}
.blob{position:absolute;inset:7%;background:var(--brand);border:3px solid var(--edge);box-shadow:10px 10px 0 var(--pink);border-radius:46% 54% 50% 50%/52% 46% 54% 48%;animation:morph 9s ease-in-out infinite alternate}
@keyframes morph{to{border-radius:56% 44% 42% 58%/44% 56% 44% 56%}}
.art .bg{position:absolute;filter:drop-shadow(0 8px 0 rgba(0,0,0,.18))}
.art .b1{width:54%;left:23%;top:24%;animation:floaty 6s ease-in-out infinite alternate}
.art .b2{width:36%;left:6%;top:50%;rotate:-10deg;animation:floaty 5s ease-in-out -1.5s infinite alternate}
.art .b3{width:34%;right:6%;top:46%;rotate:9deg;animation:floaty 7s ease-in-out -3s infinite alternate}
.art .lg{position:absolute;width:56%;top:-3%;right:-3%;rotate:5deg;animation:wob 5s ease-in-out infinite alternate;z-index:2}
.art .s1{position:absolute;width:20%;left:2%;top:6%;animation:spin 14s linear infinite}
.art .s2{position:absolute;width:15%;right:6%;bottom:6%;animation:spin 10s linear infinite reverse}
.art .s3{position:absolute;width:9%;left:46%;bottom:2%;animation:spin 8s linear infinite}
@keyframes floaty{from{transform:translateY(-10px)}to{transform:translateY(12px)}}
@keyframes wob{from{transform:rotate(-3deg) translateY(0)}to{transform:rotate(3deg) translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.in-up{animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0)*90ms)}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.pop{animation:popin .9s cubic-bezier(.2,1.3,.3,1) both;animation-delay:.2s}
@keyframes popin{from{opacity:0;transform:scale(.7) rotate(-6deg)}to{opacity:1;transform:none}}

/* marquee */
.marq{border-block:3px solid var(--edge);background:var(--pink);color:var(--on-pink);overflow:hidden;direction:ltr;padding-block:8px;rotate:-1.2deg;width:104%;margin-inline:-2%;margin-block:28px 36px;position:relative;z-index:1}
.track{display:flex;width:max-content;animation:marq 32s linear infinite}
.marq:hover .track{animation-play-state:paused}
.half{display:flex;align-items:center;gap:28px;padding-right:28px}
.half span{font-family:var(--fd);font-size:26px;white-space:nowrap;direction:rtl;line-height:1.3}
.half img{height:40px;width:auto}
.half svg{width:26px;height:26px;flex:none}
@keyframes marq{to{transform:translateX(-50%)}}

/* sections */
section.s{padding-block:clamp(28px,5vw,56px)}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.sh h2{font-family:var(--fd);font-weight:400;font-size:clamp(30px,5.5vw,52px);line-height:1.15;margin:0;text-wrap:balance}
.sh p{color:var(--muted);margin:4px 0 0}
.more{font-weight:800;border-bottom:3px solid var(--pink);padding-bottom:2px;transition:color .2s}
.more:hover{color:var(--brand-text)}

.about{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
.panel-blue{background:var(--brand);color:var(--on-brand);border:3px solid var(--edge);border-radius:32px;padding:clamp(22px,4vw,48px);position:relative;overflow:hidden;box-shadow:8px 8px 0 var(--pink);min-width:0}
.panel-blue h2{font-family:var(--fd);font-weight:400;font-size:clamp(32px,5vw,52px);margin:0 0 12px;line-height:1.2}
.panel-blue p{margin:0 0 12px;font-size:clamp(16px,2.2vw,18px);max-width:34em}
.panel-blue .deco{position:absolute;width:140px;left:-34px;bottom:-40px;animation:spin 18s linear infinite;opacity:.95}
.feats{display:grid;gap:14px;min-width:0}
.feat{display:flex;gap:14px;align-items:center;padding:16px 18px;background:var(--surface);border:2.5px solid var(--edge);border-radius:22px;transition:transform .3s}
.feat:hover{transform:translateX(-6px)}
.feat .ico{width:48px;height:48px;border-radius:50%;background:var(--pink);color:var(--on-pink);display:grid;place-items:center;flex:none;border:2.5px solid var(--edge)}
.feat b{display:block;font-weight:800;font-size:17px;line-height:1.4}
.feat span{color:var(--muted);font-size:14.5px;line-height:1.5;display:block}

.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.tile{cursor:pointer;background:color-mix(in srgb,var(--c) 20%,var(--surface));border:2.5px solid var(--edge);border-radius:24px;padding:14px 10px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 5px 0 var(--drop);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;min-width:0}
.tile:hover{transform:translateY(-6px) rotate(-1.5deg);box-shadow:0 11px 0 var(--drop)}
.tile svg{width:78%;transition:transform .5s}
.tile:hover svg{transform:scale(1.1) rotate(4deg)}
.tile b{font-family:var(--fd);font-weight:400;font-size:22px;line-height:1.3}
.tile small{color:var(--muted);font-weight:700}

/* product cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,235px),1fr));gap:20px}
.card{background:var(--surface);border:2.5px solid var(--edge);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 5px 0 var(--drop);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;min-width:0;position:relative}
.card:hover{transform:translateY(-7px);box-shadow:0 12px 0 var(--drop)}
.ph{position:relative;aspect-ratio:1/1;background:color-mix(in srgb,var(--c) 20%,var(--surface));display:grid;place-items:center;border-bottom:2.5px solid var(--edge);overflow:hidden}
.ph>svg{width:80%;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.card:hover .ph>svg{transform:scale(1.08) rotate(-3deg)}
.ph .real{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:10px;inset-inline-start:10px;background:var(--pink);color:var(--on-pink);border:2px solid var(--edge);border-radius:999px;font-weight:800;font-size:12.5px;padding:0 11px;line-height:1.7;z-index:2}
.tag.new{background:var(--brand);color:var(--on-brand)}
.wm{position:absolute;bottom:8px;inset-inline-end:8px;width:58px;height:auto;opacity:.92}
.rank{position:absolute;top:8px;inset-inline-end:10px;font-family:var(--fd);font-size:30px;line-height:1;color:var(--ink);z-index:2}
.info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.info h3{font-family:var(--fd);font-weight:400;font-size:23px;line-height:1.25;margin:0}
.info .cat{font-size:13.5px;color:var(--muted);font-weight:700;margin-top:-6px}
.buy{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:auto}
.price{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px;min-width:0}
.price b{font-family:var(--fd);font-weight:400;font-size:28px;line-height:1.2;color:var(--brand-text)}
.price small{font-weight:800;font-size:14px}
.price s{color:var(--muted);font-size:14px;font-weight:600}
.wa{width:48px;height:48px;border-radius:50%;background:var(--wa);color:#fff;display:grid;place-items:center;border:2.5px solid var(--edge);flex:none;position:relative;transition:transform .25s cubic-bezier(.2,1.4,.4,1)}
.wa svg{width:25px;height:25px}
.wa::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--wa);animation:ping 2.4s ease-out infinite;opacity:0}
.wa:hover{transform:scale(1.12) rotate(10deg)}
@keyframes ping{0%{transform:scale(.8);opacity:.8}100%{transform:scale(1.4);opacity:0}}
.card.rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(min(var(--i,0),10)*45ms)}

/* reveal on scroll */
.rv{transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.rv.pre{opacity:.35;transform:translateY(30px) scale(.985)}

/* brand band */
.band{background:var(--brand);color:var(--on-brand);border:3px solid var(--edge);border-radius:36px;box-shadow:8px 8px 0 var(--pink);position:relative;overflow:hidden;display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center;padding:clamp(24px,5vw,56px);isolation:isolate}
.band h2{font-family:var(--fd);font-weight:400;font-size:clamp(34px,6vw,64px);line-height:1.15;margin:0 0 12px;text-wrap:balance}
.band p{margin:0 0 20px;max-width:30em;font-size:18px}
.band .pat{position:absolute;inset:0;z-index:-1;pointer-events:none}
.band .pat img{position:absolute;height:auto;opacity:.18;animation:drift var(--dur,10s) ease-in-out infinite alternate}
.band .big{width:100%;max-width:340px;margin-inline:auto;rotate:-4deg;animation:wob 6s ease-in-out infinite alternate}

/* feedback */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px}
.fb{background:var(--surface);border:2.5px solid var(--edge);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px;position:relative;min-width:0;box-shadow:0 5px 0 var(--drop);transition:transform .3s}
.fb:hover{transform:translateY(-5px) rotate(-.6deg)}
.fb.fresh{animation:popin .7s cubic-bezier(.2,1.3,.3,1) both}
.fb .q{position:absolute;top:6px;inset-inline-end:16px;font-family:var(--fd);font-size:64px;line-height:1;color:var(--pink)}
.fb header{display:flex;align-items:center;gap:12px;position:static}
.av{width:56px;height:56px;border-radius:50%;border:2.5px solid var(--edge);overflow:hidden;flex:none;display:grid;place-items:center;background:var(--pink);object-fit:cover}
.av svg{width:100%;height:100%}
.av.ini{font-family:var(--fd);font-size:26px;color:var(--on-pink)}
.fb h3{margin:0;font-size:17px;font-weight:800;line-height:1.3}
.stars{letter-spacing:2px;color:var(--pink-deep);font-size:17px;line-height:1.2;display:block}
.stars .off{color:var(--line)}
.fb p{margin:0;color:var(--ink);font-size:16px}
.sum{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--surface);border:2.5px solid var(--edge);border-radius:24px;padding:16px 22px;margin-bottom:22px}
.sum .n{font-family:var(--fd);font-size:56px;line-height:1;color:var(--brand-text)}
.note{color:var(--muted);font-size:14px;margin:0}

/* forms / panels */
.panel{background:var(--surface);border:2.5px solid var(--edge);border-radius:28px;padding:clamp(18px,3vw,28px);box-shadow:0 5px 0 var(--drop);min-width:0}
.panel h3{font-family:var(--fd);font-weight:400;font-size:28px;margin:0 0 12px;line-height:1.3}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;margin-bottom:14px}
.field>label,.lab{font-weight:800;font-size:14px}
.field input[type=text],.field input[type=search],.field select,.field textarea{width:100%;padding:11px 14px;border-radius:14px;border:2.5px solid var(--edge);background:var(--bg);min-width:0}
.field textarea{resize:vertical}
.field input[type=range]{width:100%;accent-color:var(--brand)}
.field input::placeholder,.field textarea::placeholder{color:var(--muted)}
.chk{display:flex;align-items:center;gap:8px;font-weight:800;cursor:pointer;padding-block:10px}
.chk input{width:20px;height:20px;accent-color:var(--brand)}
.avrow{display:flex;gap:14px;align-items:flex-end}
.avrow .field{flex:1}
.avpick{width:72px;height:72px;border-radius:50%;border:2.5px dashed var(--edge);display:grid;place-items:center;cursor:pointer;overflow:hidden;font-weight:800;font-size:13px;text-align:center;flex:none;margin-bottom:14px;line-height:1.3;background:var(--bg)}
.avpick img{width:100%;height:100%;object-fit:cover}
.rate{display:flex;gap:4px}
.rate button{background:none;border:0;cursor:pointer;font-size:34px;line-height:1;color:var(--line);padding:0 2px;transition:transform .2s,color .2s}
.rate button.on{color:var(--pink-deep)}
.rate button:hover{transform:scale(1.2) rotate(8deg)}

/* products page */
.pg-h{padding-block:clamp(22px,4vw,44px) 8px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.pg-h h1{font-family:var(--fd);font-weight:400;font-size:clamp(40px,8vw,80px);line-height:1.1;margin:0}
.pg-h .st{width:clamp(56px,10vw,104px);flex:none;animation:spin 12s linear infinite}
.rail{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 4px 22px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.rail .card{flex:0 0 min(74vw,255px);scroll-snap-align:start}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.chip{padding:6px 18px;border-radius:999px;border:2.5px solid var(--edge);background:var(--surface);font-weight:800;cursor:pointer;transition:transform .2s,background .2s;white-space:nowrap}
.chip:hover{transform:translateY(-2px)}
.chip.on{background:var(--brand);color:var(--on-brand)}
.chip small{opacity:.7;margin-inline-start:4px}
.filters{display:grid;grid-template-columns:1.6fr 1fr 1.3fr auto;gap:6px 18px;align-items:end;background:var(--surface);border:2.5px solid var(--edge);border-radius:24px;padding:18px 18px 6px;margin-bottom:20px}
.count{font-weight:800;color:var(--muted);margin:0 0 14px}
.empty{grid-column:1/-1;text-align:center;padding:40px 16px;background:var(--surface);border:2.5px dashed var(--edge);border-radius:24px}
.empty svg{width:70px;margin:0 auto 8px;animation:spin 10s linear infinite}
.empty b{font-family:var(--fd);font-weight:400;font-size:26px;display:block}

/* contact */
.chans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px;margin-bottom:22px}
.chan{background:var(--surface);border:2.5px solid var(--edge);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;box-shadow:0 5px 0 var(--drop);transition:transform .3s;min-width:0}
a.chan:hover{transform:translateY(-6px)}
.chan .ico{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:2.5px solid var(--edge);background:var(--pink);color:var(--on-pink);margin-bottom:4px}
.chan .ico svg{width:26px;height:26px}
.chan.wa-c{background:var(--wa);color:#fff}
.chan.wa-c .ico{background:#fff;color:var(--wa)}
.chan b{font-family:var(--fd);font-weight:400;font-size:26px;line-height:1.3}
.chan span.t{opacity:.85;font-size:15px}
.chan .num{font-weight:800;font-size:20px;direction:ltr;unicode-bidi:plaintext}
.cgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:start}
.info-l{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.info-l li{display:flex;gap:12px;align-items:flex-start}
.info-l .ico{width:42px;height:42px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none}
.info-l .ico svg{width:20px;height:20px}
.info-l b{display:block;line-height:1.4}
.info-l span{color:var(--muted);font-size:15px}

/* footer */
.foot{margin-top:clamp(40px,7vw,80px);background:var(--brand);color:var(--on-brand);border-top:3px solid var(--edge);padding-block:36px 28px;overflow:hidden}
.foot .cols{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:24px;align-items:start}
.foot img.lg{width:min(100%,230px);height:auto}
.foot h4{font-family:var(--fd);font-weight:400;font-size:24px;margin:0 0 8px}
.foot ul{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.foot a:hover{text-decoration:underline;text-decoration-color:var(--pink);text-underline-offset:4px;text-decoration-thickness:3px}
.foot .cp{margin-top:22px;padding-top:16px;border-top:2px solid rgba(247,245,236,.25);font-size:14px;opacity:.9}

/* bottom bar (phones) */
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:2.5px solid var(--edge);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--muted);min-width:0;line-height:1.3}
.tabbar .ic{width:50px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .3s,transform .3s}
.tabbar .ic svg{width:22px;height:22px}
.tabbar a.on{color:var(--ink)}
.tabbar a.on .ic{background:var(--pink);color:var(--on-pink);transform:translateY(-2px)}
.wa-head{display:inline-flex}
.toast{position:fixed;left:50%;bottom:28px;translate:-50% 20px;background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .3s,translate .3s;z-index:120;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;translate:-50% 0}
#view.enter{animation:pageIn .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* cart */
.acts{display:flex;gap:10px;align-items:center}
.cartbtn{position:relative;width:46px;height:46px;border-radius:50%;border:2.5px solid var(--edge);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 var(--drop);transition:transform .2s,box-shadow .2s;flex:none}
.cartbtn:hover{transform:translateY(2px);box-shadow:0 2px 0 var(--drop)}
.cartbtn svg{width:24px;height:24px}
.cartbtn .n{position:absolute;top:-8px;inset-inline-end:-8px;min-width:22px;height:22px;border-radius:999px;background:var(--pink);color:var(--on-pink);border:2px solid var(--edge);font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px;line-height:1}
.cartbtn.bump{animation:bump .45s ease}
@keyframes bump{40%{transform:scale(1.22) rotate(-10deg)}}
.cc{margin-top:2px}
.addcart{width:100%;background:var(--surface-2);box-shadow:0 3px 0 var(--drop)}
.step{display:flex;align-items:center;justify-content:space-between;gap:8px;border:2.5px solid var(--edge);border-radius:999px;background:var(--brand);color:var(--on-brand);padding:2px;font-weight:800;font-size:14px}
.step button{width:32px;height:32px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);font-weight:800;font-size:20px;cursor:pointer;line-height:1;flex:none;transition:transform .15s}
.step button:hover{transform:scale(1.12)}
.step.sm{width:max-content;gap:10px;margin-top:4px;font-size:13px}
.step.sm button{width:26px;height:26px;font-size:17px}
.ov{position:fixed;inset:0;background:rgba(5,8,30,.58);z-index:100;opacity:0;pointer-events:none;transition:opacity .35s}
.ov.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(100%,430px);background:var(--bg);border-right:3px solid var(--edge);z-index:101;display:flex;flex-direction:column;translate:-104% 0;transition:translate .45s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px)}
.drawer.open{translate:0 0}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:2.5px solid var(--edge);background:var(--brand);color:var(--on-brand)}
.dh h3{font-family:var(--fd);font-weight:400;font-size:30px;margin:0;line-height:1.2}
.x{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--edge);background:var(--surface);color:var(--ink);font-size:24px;line-height:1;cursor:pointer}
.dbody{flex:1;overflow-y:auto;padding:16px 18px;display:grid;gap:12px;align-content:start}
.ci{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:2.5px solid var(--edge);border-radius:18px;padding:10px}
.th{width:64px;height:64px;border-radius:12px;background:color-mix(in srgb,var(--c) 20%,var(--surface));display:grid;place-items:center;border:2px solid var(--edge);overflow:hidden}
.th svg{width:92%}
.cm{min-width:0;display:flex;flex-direction:column;gap:0}
.cm b{font-weight:800;line-height:1.3}
.cm span{color:var(--muted);font-size:14px}
.cr{display:flex;flex-direction:column;align-items:flex-end;text-align:end;gap:2px}
.cr b{font-family:var(--fd);font-weight:400;font-size:22px;color:var(--brand-text);line-height:1.2}
.cr small{font-weight:800;font-size:12px;margin-top:-4px}
.rm{width:28px;height:28px;border-radius:50%;border:2px solid var(--edge);background:var(--bg);cursor:pointer;font-size:17px;line-height:1;color:var(--ink)}
.rm:hover{background:var(--pink);color:var(--on-pink)}
.dfoot{padding:14px 18px calc(16px + env(safe-area-inset-bottom,0px));border-top:2.5px solid var(--edge);display:grid;gap:10px;background:var(--surface)}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.tot b{font-family:var(--fd);font-weight:400;font-size:32px;color:var(--brand-text);line-height:1.2}
.lnk{background:none;border:0;text-decoration:underline;font-weight:700;cursor:pointer;color:var(--muted)}
.dfoot .note{text-align:center}

/* responsive */
@media (max-width:980px){
  .filters{grid-template-columns:1fr 1fr}
  .cgrid{grid-template-columns:1fr}
}
@media (max-width:820px){
  .nav{display:none}
  .tabbar{display:flex}
  #app{padding-bottom:86px}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .hero,.about,.band,.foot .cols{grid-template-columns:1fr}
  .art{max-width:420px}
  .band .big{max-width:240px}
  .brand img{height:44px}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
}
@media (max-width:560px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .card{border-radius:18px}
  .info{padding:10px 11px 12px}
  .info h3{font-size:19px}
  .price b{font-size:23px}
  .wa{width:42px;height:42px}
  .wa svg{width:22px;height:22px}
  .tag{font-size:11.5px;top:7px;inset-inline-start:7px}
  .wm{width:44px}
  .filters{grid-template-columns:1fr}
  .cats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wa-head span{display:none}
  .wa-head{padding:9px 12px}
  .panel-blue .deco{width:100px}
  .half span{font-size:22px}
}
@media (max-width:340px){
  .grid{grid-template-columns:1fr}
  .tabbar a{font-size:10.5px}
  .tabbar .ic{width:40px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
  .rv.pre{opacity:1;transform:none}
}

function mix(hex,t){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;const f=t>=0?0:255,k=Math.abs(t);
  r=Math.round(r+(f-r)*k);g=Math.round(g+(f-g)*k);b=Math.round(b+(f-b)*k);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
function lum(hex){const n=parseInt(hex.slice(1),16);return(.299*(n>>16)+.587*((n>>8)&255)+.114*(n&255))/255}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

        <div class="feat"><div class="ico">${WA_ICON.replace('<svg','<svg width="24" height="24"')}</div><div><b>طلب سهل</b><span>دوس على أيقونة الواتساب والرسالة بتتكتب لوحدها</span></div></div>
        <div class="feat"><div class="ico">${ic('tag')}</div><div><b>سعر واضح</b><span>السعر مكتوب على كل منتج من غير مفاجآت</span></div></div>

  </section>

    ${secHead('أقسامنا','اختار القسم وشوف الموديلات')}

}

function pageProducts(){
  const top=[...PRODUCTS].sort((a,b)=>b.pop-a.pop).slice(0,6).map((p,i)=>({...p,_rank:i+1}));
  const chip=(n,l)=>`<button class="chip ${S.cat===n?'on':''}" data-chip="${n}">${l}</button>`;
  return `
  <div class="wrap pg-h"><h1 class="in-up">المنتجات</h1>${starSVG('st')}</div>
  <section class="wrap s rv" style="padding-top:10px">
    ${secHead('التوب','أكتر ٦ موديلات مطلوبة دلوقتي')}
    <div class="rail">${top.map((p,i)=>card(p,i)).join('')}</div>
  </section>
  <section class="wrap s" style="padding-top:10px" id="all">
    ${secHead('كل الموديلات','')}
    <div class="chips" role="group" aria-label="الأقسام">${chip('الكل',`الكل<small>${PRODUCTS.length}</small>`)}${CATS.map(c=>chip(c.name,`${c.name}<small>${PRODUCTS.filter(p=>p.cat===c.name).length}</small>`)).join('')}</div>
    <div class="filters">
      <div class="field"><label for="q">دوّر على شنطة</label><input type="search" id="q" placeholder="اكتب اسم الموديل أو القسم" value="${esc(S.q)}" autocomplete="off"></div>
      <div class="field"><label for="sort">الترتيب</label><select id="sort">
        <option value="pop" ${S.sort==='pop'?'selected':''}>الأكثر طلباً</option>
        <option value="new" ${S.sort==='new'?'selected':''}>الأحدث</option>
        <option value="lo" ${S.sort==='lo'?'selected':''}>الأقل سعراً</option>
        <option value="hi" ${S.sort==='hi'?'selected':''}>الأعلى سعراً</option></select></div>
      <div class="field"><label for="maxp">السعر لحد <span id="maxl">${fmt(S.max)}</span> جنيه</label><input type="range" id="maxp" min="${MINP}" max="${MAXP}" step="50" value="${S.max}"></div>
      <label class="chk"><input type="checkbox" id="sale" ${S.sale?'checked':''}>الخصومات بس</label>
    </div>
    <p class="count" id="count" aria-live="polite"></p>
    <div class="grid" id="grid"></div>
  </section>`;
}
function filtered(){
  const q=norm(S.q.trim());
  let l=PRODUCTS.filter(p=>(S.cat==='الكل'||p.cat===S.cat)&&p.price<=S.max&&(!S.sale||p.old)&&(!q||norm(p.name+' '+p.cat).includes(q)));
  const by={pop:(a,b)=>b.pop-a.pop,new:(a,b)=>b.id-a.id,lo:(a,b)=>a.price-b.price,hi:(a,b)=>b.price-a.price}[S.sort];
  return l.sort(by);
}
function renderGrid(){
  const g=$('#grid');if(!g)return;const l=filtered();
  $('#count').textContent=l.length?`${l.length} موديل`:'';
  g.innerHTML=l.length?l.map((p,i)=>card(p,i,'rise')).join(''):`<div class="empty">${starSVG()}<b>مفيش نتيجة بالشكل ده</b><span class="note">جرّب تغيّر القسم أو السعر أو كلمة البحث.</span></div>`;
}

  <section class="wrap s" style="padding-top:12px">

      <div class="chan"><div class="ico">${ic('phone')}</div><b>اتصل بينا</b><span class="num">${esc(CONFIG.phone)}</span><button class="btn sm" data-copy="${esc(CONFIG.phone)}">${ic('copy',18)}انسخ الرقم</button></div>
      <a class="chan" href="${CONFIG.instagram}" target="_blank" rel="noopener"><div class="ico">${ic('insta')}</div><b>انستجرام</b><span class="t">شوف أحدث الموديلات والصور</span></a>

          <li><div class="ico">${ic('pin')}</div><div><b>العنوان</b><span>${esc(CONFIG.address)}</span></div></li>
          <li><div class="ico">${ic('chat')}</div><div><b>الطلب</b><span>من صفحة المنتجات دوس على أيقونة الواتساب جنب السعر</span></div></li>

function updateCwa(){
  const a=$('#cwa');if(!a)return;const n=($('#cname').value||'').trim(),m=($('#cmsg').value||'').trim();
  a.href=waLink('أهلاً لاروز'+(n?'، أنا '+n:'')+(m?'\n'+m:''));

function pageFeedback(){
  return `
  <div class="wrap pg-h"><h1 class="in-up">آراء العملاء</h1>${starSVG('st')}</div>
  <section class="wrap s" style="padding-top:12px">
    <div class="sum rv" id="sum"></div>

      <div class="field"><label for="fbtext">تعليقك</label><textarea id="fbtext" rows="4" maxlength="280" placeholder="احكيلنا عن تجربتك"></textarea></div>

}
function renderFeedback(fresh){
  const l=$('#flist');if(!l)return;
  l.innerHTML=FEEDBACK.map((f,i)=>fbCard(f,fresh&&i===0)).join('');
  const avg=FEEDBACK.reduce((a,f)=>a+f.r,0)/FEEDBACK.length;
  $('#sum').innerHTML=`<span class="n">${avg.toFixed(1)}</span><div><span class="stars" style="font-size:24px">${stars(Math.round(avg))}</span><b>${FEEDBACK.length} رأي</b></div>`;
}

const ROUTES={home:pageHome,products:pageProducts,contact:pageContact,feedback:pageFeedback};
const NAV=[['home','الرئيسية','home'],['products','المنتجات','bag'],['contact','التواصل','chat'],['feedback','آراء العملاء','star']];

/* ---------- shell ---------- */
function shell(){
  $('#app').innerHTML=`
  <div id="prog"></div>
  <header class="top" id="top"><div class="wrap bar">
    <a class="brand" href="#home" aria-label="LAROSE الرئيسية"><img src="${LOGO}" alt="LAROSE" width="94" height="50"></a>
    <nav class="nav" aria-label="القائمة الرئيسية">${NAV.map(n=>`<a href="#${n[0]}" data-nav="${n[0]}">${n[1]}</a>`).join('')}</nav>
    <div class="acts">
      <button type="button" class="cartbtn" id="cartbtn" aria-label="افتح السلة">${ic('cart',24)}<span class="n" id="cartn" hidden>0</span></button>
      <a class="btn green sm wa-head" href="${waLink('أهلاً لاروز')}" target="_blank" rel="noopener" aria-label="واتساب">${WA_ICON}<span>واتساب</span></a>
    </div>
  </div></header>
  <main id="view"></main>
  <footer class="foot"><div class="wrap">
    <div class="cols">
      <div><img class="lg" src="${LOGO}" alt="LAROSE"><p style="margin:10px 0 0;max-width:22em">ستور شنط بألوان بتفرّح. اطلب من الواتساب في ثواني.</p></div>
      <div><h4>الصفحات</h4><ul>${NAV.map(n=>`<li><a href="#${n[0]}">${n[1]}</a></li>`).join('')}</ul></div>
      <div><h4>تواصل</h4><ul><li><a href="${waLink('أهلاً لاروز')}" target="_blank" rel="noopener">واتساب</a></li><li><a href="${CONFIG.instagram}" target="_blank" rel="noopener">انستجرام</a></li><li><a href="${CONFIG.facebook}" target="_blank" rel="noopener">فيسبوك</a></li></ul></div>
    </div>
    <div class="cp">© LAROSE 2026 · نسخة تجريبية للتصميم</div>
  </div></footer>
  <nav class="tabbar" aria-label="التنقل">${NAV.map(n=>`<a href="#${n[0]}" data-nav="${n[0]}"><span class="ic">${ic(n[2])}</span>${n[1]}</a>`).join('')}</nav>
  <div class="ov" id="ov"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="سلة الطلب" inert>
    <div class="dh"><h3>سلتك</h3><button type="button" class="x" id="cclose" aria-label="اقفل السلة">×</button></div>
    <div class="dbody" id="cbody"></div>
    <div class="dfoot" id="cfoot" hidden>
      <div class="tot"><span>الإجمالي</span><b><span id="ctotal">0</span> جنيه</b></div>
      <a class="btn green" id="csend" href="#" target="_blank" rel="noopener">${WA_ICON}ابعت الطلب على واتساب</a>
      <button type="button" class="lnk" data-clear>فضّي السلة</button>
      <p class="note">الزر بيفتح الواتساب والطلب مكتوب جاهز، وانت اللي بتبعته.</p>
    </div>
  </aside>
  <div class="toast" id="toast" role="status"></div>`;
}

/* ---------- scattered logos ---------- */
function scatter(){
  const box=$('#scatter'),mobile=innerWidth<700,cols=mobile?3:5,rows=mobile?4:4,r=rng(11);let h='';
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const w=(mobile?64:84)+r()*(mobile?44:70);
    h+=`<img src="${LOGO}" alt="" data-depth="${(.03+r()*.09).toFixed(3)}" style="width:${w.toFixed(0)}px;left:${(x/cols*100+r()*(60/cols)-2).toFixed(1)}%;top:${(y/rows*100+r()*(60/rows)-2).toFixed(1)}%;rotate:${(r()*56-28).toFixed(0)}deg;--dur:${(9+r()*9).toFixed(1)}s;--dl:${(-r()*9).toFixed(1)}s">`;
  }
  box.innerHTML=h;
}

/* ---------- routing ---------- */
let current=null,view;
function navigate(name,force){
  closeCart();
  if(!ROUTES[name])name='home';
  if(name===current&&!force){window.scrollTo({top:0,behavior:'smooth'});return}
  current=name;
  view.innerHTML=ROUTES[name]();
  view.classList.remove('enter');void view.offsetWidth;view.classList.add('enter');
  $$('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===name));
  window.scrollTo({top:0,behavior:'instant'});
  if(name==='products')renderGrid();
  if(name==='feedback')renderFeedback();
  setupReveal();
  try{if(location.hash.slice(1)!==name)location.hash=name}catch(e){}
}
let io;
function setupReveal(){
  if(!('IntersectionObserver' in window))return;
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.remove('pre');io.unobserve(e.target)}}),{threshold:.08,rootMargin:'0px 0px -6% 0px'});
  $$('.rv').forEach(el=>{if(el.getBoundingClientRect().top>innerHeight*.92){el.classList.add('pre');io.observe(el)}});
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target;let el;
  if(el=t.closest('[data-add]')){setQty(el.dataset.add,(CART[el.dataset.add]||0)+1,true);return}
  if(el=t.closest('[data-inc]')){setQty(el.dataset.inc,(CART[el.dataset.inc]||0)+1,true);return}
  if(el=t.closest('[data-dec]')){setQty(el.dataset.dec,(CART[el.dataset.dec]||0)-1);return}
  if(el=t.closest('[data-rm]')){setQty(el.dataset.rm,0);return}
  if(t.closest('[data-clear]')){CART={};saveCart();refreshCart();return}
  if(t.closest('#cartbtn')){openCart();return}
  if(t.closest('#cclose')||t.id==='ov'){closeCart();return}
  const a=e.target.closest('a[href^="#"]');
  if(a){e.preventDefault();navigate(a.getAttribute('href').slice(1));return}
  const tile=e.target.closest('[data-cat]');
  if(tile){S.cat=tile.dataset.cat;navigate('products',true);setTimeout(()=>{const el=$('#all');if(el)el.scrollIntoView({behavior:'smooth'})},120);return}
  const chip=e.target.closest('[data-chip]');
  if(chip){S.cat=chip.dataset.chip;$$('.chip').forEach(c=>c.classList.toggle('on',c===chip));renderGrid();return}
  const cp=e.target.closest('[data-copy]');
  if(cp){const txt=cp.dataset.copy;
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('اتنسخ الرقم')).catch(()=>{
      const el=cp.previousElementSibling;if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast('الرقم اتحدد، انسخه من عندك')});return}
  const rt=e.target.closest('[data-rate]');
  if(rt){S.rate=+rt.dataset.rate;$$('[data-rate]').forEach(b=>{const n=+b.dataset.rate;b.classList.toggle('on',n<=S.rate);b.setAttribute('aria-checked',n===S.rate)})}
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='q'){S.q=e.target.value;renderGrid()}
  else if(id==='maxp'){S.max=+e.target.value;$('#maxl').textContent=fmt(S.max);renderGrid()}
  else if(id==='cname'||id==='cmsg')updateCwa();
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='sort'){S.sort=e.target.value;renderGrid()}
  else if(id==='sale'){S.sale=e.target.checked;renderGrid()}
  else if(id==='fbphoto'){
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{
      const s=120,c=document.createElement('canvas');c.width=c.height=s;const m=Math.min(im.width,im.height);
      c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);
      S.photo=c.toDataURL('image/jpeg',.82);const p=$('#fbprev');p.src=S.photo;p.hidden=false;$('#fbph').hidden=true};im.src=rd.result};
    rd.readAsDataURL(f);
  }
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='fbform')return;e.preventDefault();
  const n=$('#fbname').value.trim(),t=$('#fbtext').value.trim();
  if(!n||!t){toast('اكتب اسمك وتعليقك الأول');return}
  FEEDBACK.unshift({n,r:S.rate,t,photo:S.photo});
  S.photo='';e.target.reset();$('#fbprev').hidden=true;$('#fbph').hidden=false;
  renderFeedback(true);toast('الرأي اتضاف هنا، ومش متخزن لسه');
  const l=$('#flist');if(l)l.scrollIntoView({behavior:'smooth',block:'start'});
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCart()});
let tick=false;
function onScroll(){
  if(tick)return;tick=true;
  requestAnimationFrame(()=>{
    const y=scrollY,h=document.documentElement.scrollHeight-innerHeight;
    $('#prog').style.transform='scaleX('+(h>0?Math.min(1,y/h):0)+')';
    $('#top').classList.toggle('scrolled',y>8);
    tick=false;
  });
}
addEventListener('scroll',onScroll,{passive:true});
addEventListener('hashchange',()=>navigate(location.hash.slice(1)||'home'));

/* ---------- boot ---------- */
shell();view=$('#view');
let first='home';try{first=location.hash.slice(1)||'home'}catch(e){}
navigate(first,true);refreshCart();onScroll();
</script>
